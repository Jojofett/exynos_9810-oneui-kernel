name: Build Kernel

on:
  push:
    branches: [ "4.9.337-oneui", "main", "master" ]
  pull_request:
    branches: [ "4.9.337-oneui", "main", "master" ]
  workflow_dispatch:  # Allows manual triggering
    inputs:
      clean_build:
        description: 'Clean build?'
        required: true
        default: 'y'
        type: choice
        options:
          - 'y'
          - 'n'

env:
  KERNEL_NAME: "DS-ACK"
  KERNEL_VERSION: "V1.11"

jobs:
  build-starlte:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Deaktiviere Submodules wegen KernelSU-Next Problem
        submodules: false
        fetch-depth: 0

    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libncurses-dev \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          wget \
          curl \
          tar \
          unzip \
          git \
          bc \
          rsync \
          python3 \
          python3-pip \
          bsdiff \
          zstd \
          cpio \
          abootimg \
          lz4 \
          lzop \
          expect
        
        sudo ln -sf /usr/bin/python3 /usr/bin/python

    - name: Prepare build script
      run: |
        # Erstelle expect Skript für automatisierte Builds
        cat > build.exp << 'EOF'
        #!/usr/bin/expect -f
        
        set timeout 1800  # 30 Minuten timeout
        
        spawn ./apollo.sh
        
        # 1. Target device: starlte (Option 1)
        expect "Please select your build target (1-8) >"
        send "1\r"
        
        # 2. Compiler: clang 18 (Option 3)
        expect "Please select your compiler (1-7) >"
        send "3\r"
        
        # 3. SELinux: permissive (Option 1)
        expect "Please select your SElinux mode (1-2) >"
        send "1\r"
        
        # 4. KernelSU: no
        expect "Enable KernelSU? (y/n) >"
        send "n\r"
        
        # 5. Clean build: aus Input oder default
        expect "Clean Builds? (y/n) >"
        send "$env(CLEAN_BUILD)\r"
        
        # Warte auf Toolchain Download Prompt
        expect {
          "Download Toolchain ? (y/n) >" {
            send "y\r"
            exp_continue
          }
          "Press Any key to end the script" {
            send "\r"
          }
          timeout {
            send_user "\nTimeout nach 30 Minuten\n"
            exit 1
          }
          eof
        }
        
        send_user "\nBuild abgeschlossen\n"
        EOF
        
        chmod +x build.exp

    - name: Build kernel
      env:
        CLEAN_BUILD: ${{ github.event.inputs.clean_build || 'y' }}
      run: |
        # Stelle sicher, dass apollo.sh ausführbar ist
        chmod +x apollo.sh
        
        echo "Build-Parameter:"
        echo "  Target: starlte (1)"
        echo "  Compiler: clang 18 (3)"
        echo "  SELinux: permissive (1)"
        echo "  KernelSU: no (n)"
        echo "  Clean build: $CLEAN_BUILD"
        
        # Führe Build mit expect aus
        if ./build.exp; then
          echo "✅ Build-Prozess abgeschlossen"
        else
          echo "❌ Build fehlgeschlagen"
          exit 1
        fi

    - name: Check build output
      run: |
        echo "Überprüfe Build-Ausgabe..."
        
        # Prüfe ob Kernel-Images erstellt wurden
        if find Apollo/Product/ -name "*.img" -type f 2>/dev/null | grep -q .; then
          echo "✅ Kernel-Images gefunden:"
          ls -lh Apollo/Product/*.img
        else
          echo "⚠️ Keine Images im Product-Ordner gefunden"
        fi
        
        if find Apollo/Out/ -name "*.img" -type f 2>/dev/null | grep -q .; then
          echo "✅ Kernel-Images im Out-Ordner:"
          ls -lh Apollo/Out/*.img
        else
          echo "⚠️ Keine Images im Out-Ordner gefunden"
        fi
        
        # Mindestens ein Image sollte existieren
        if [ ! -f "Apollo/Product/"*.img ] && [ ! -f "Apollo/Out/"*.img ]; then
          echo "❌ KEINE Kernel-Images gefunden! Build fehlgeschlagen."
          exit 1
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-starlte-${{ github.sha }}
        path: |
          Apollo/Product/
          Apollo/Out/
        retention-days: 30

    - name: Create build summary
      if: always()
      run: |
        echo "## 🚀 Kernel Build Zusammenfassung" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build-Details:**" >> $GITHUB_STEP_SUMMARY
        echo "- **Datum:** $(date '+%d.%m.%Y %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Target:** starlte" >> $GITHUB_STEP_SUMMARY
        echo "- **Compiler:** clang 18" >> $GITHUB_STEP_SUMMARY
        echo "- **SELinux:** permissive" >> $GITHUB_STEP_SUMMARY
        echo "- **KernelSU:** deaktiviert" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "**Generierte Dateien:**" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        find Apollo/ -name "*.img" -type f 2>/dev/null | xargs ls -lh 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "Keine Images gefunden" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        
        # Build-Status
        if [ -f "Apollo/Product/"*.img ] || [ -f "Apollo/Out/"*.img ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ **Build erfolgreich!**" >> $GITHUB_STEP_SUMMARY
          echo "Die Artefakte können unter der Registerkarte 'Artifacts' heruntergeladen werden." >> $GITHUB_STEP_SUMMARY
        else
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ❌ **Build fehlgeschlagen**" >> $GITHUB_STEP_SUMMARY
          echo "Es wurden keine Kernel-Images generiert." >> $GITHUB_STEP_SUMMARY
        fi
