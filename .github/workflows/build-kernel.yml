name: Build Kernel

on:
  push:
    branches: [ "4.9.337-oneui" ]
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Clean build?'
        required: true
        default: 'y'
        type: choice
        options:
          - 'y'
          - 'n'

env:
  KERNEL_NAME: "DS-ACK"
  KERNEL_VERSION: "V1.11"

jobs:
  build-starlte:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false
        fetch-depth: 0

    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libncurses-dev \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          wget \
          curl \
          tar \
          unzip \
          git \
          bc \
          rsync \
          python3 \
          python3-pip \
          bsdiff \
          zstd \
          cpio \
          abootimg \
          lz4 \
          lzop \
          expect
        
        sudo ln -sf /usr/bin/python3 /usr/bin/python

    - name: Prepare build script
      run: |
        # Create expect script for automated build
        cat > build.exp << 'EOF'
        #!/usr/bin/expect -f
        
        # Set timeout to 30 minutes
        set timeout 1800
        
        spawn ./apollo.sh
        
        # 1. Target device: starlte (Option 1)
        expect "Please select your build target (1-8) >"
        send "1\r"
        
        # 2. Compiler: clang 18 (Option 3)
        expect "Please select your compiler (1-7) >"
        send "3\r"
        
        # 3. SELinux: permissive (Option 1)
        expect "Please select your SElinux mode (1-2) >"
        send "1\r"
        
        # 4. KernelSU: no
        expect "Enable KernelSU? (y/n) >"
        send "n\r"
        
        # 5. Clean build: from input or default
        expect "Clean Builds? (y/n) >"
        send "$env(CLEAN_BUILD)\r"
        
        # Wait for toolchain download prompt
        expect {
          "Download Toolchain ? (y/n) >" {
            send "y\r"
            exp_continue
          }
          "Press Any key to end the script" {
            send "\r"
          }
          timeout {
            send_user "\nTimeout after 30 minutes\n"
            exit 1
          }
          eof
        }
        
        send_user "\nBuild completed\n"
        EOF
        
        chmod +x build.exp

    - name: Build kernel
      env:
        CLEAN_BUILD: ${{ github.event.inputs.clean_build || 'y' }}
      run: |
        # Make sure apollo.sh is executable
        chmod +x apollo.sh
        
        echo "Build parameters:"
        echo "  Target: starlte (1)"
        echo "  Compiler: clang 18 (3)"
        echo "  SELinux: permissive (1)"
        echo "  KernelSU: no (n)"
        echo "  Clean build: $CLEAN_BUILD"
        
        # Run build with expect
        echo "Starting automated build..."
        if ./build.exp; then
          echo "✅ Build process completed"
        else
          echo "❌ Build failed"
          exit 1
        fi

    - name: Check build output
      run: |
        echo "Checking build output..."
        
        # Check if kernel images were created
        if find Apollo/Product/ -name "*.img" -type f 2>/dev/null | grep -q .; then
          echo "✅ Kernel images found in Product/:"
          ls -lh Apollo/Product/*.img
        else
          echo "⚠️ No images found in Product/"
        fi
        
        if find Apollo/Out/ -name "*.img" -type f 2>/dev/null | grep -q .; then
          echo "✅ Kernel images found in Out/:"
          ls -lh Apollo/Out/*.img
        else
          echo "⚠️ No images found in Out/"
        fi
        
        # At least one image should exist
        if [ ! -f "Apollo/Product/"*.img ] && [ ! -f "Apollo/Out/"*.img ]; then
          echo "❌ NO kernel images found! Build failed."
          exit 1
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-starlte-${{ github.sha }}
        path: |
          Apollo/Product/
          Apollo/Out/
        retention-days: 30
