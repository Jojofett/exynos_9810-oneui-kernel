name: Build Kernel

on:
  push:
    branches: [ "4.9.337-oneui" ]
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Clean build?'
        required: true
        default: 'y'
        type: choice
        options:
          - 'y'
          - 'n'

env:
  KERNEL_NAME: "DS-ACK"
  KERNEL_VERSION: "V1.11"

jobs:
  build-starlte:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false  # KernelSU ist nicht verfügbar, also deaktivieren
        fetch-depth: 0

    - name: Fix KernelSU Kconfig issue
      run: |
        echo "Fixing KernelSU Kconfig references..."
        
        # Lösche oder kommentiere KernelSU Verweise in Kconfig Dateien
        # Option 1: Lösche die Zeile komplett
        sed -i '/kernelsu/d' drivers/Kconfig 2>/dev/null || true
        
        # Option 2: Oder kommentiere sie aus
        sed -i 's/^.*kernelsu.*$/# &/' drivers/Kconfig 2>/dev/null || true
        
        # Prüfe ob die problematische Zeile noch existiert
        if grep -q "kernelsu" drivers/Kconfig 2>/dev/null; then
          echo "⚠️ KernelSU reference still exists in drivers/Kconfig"
          echo "Manually fixing line 249..."
          # Lösche spezifisch Zeile 249
          sed -i '249d' drivers/Kconfig 2>/dev/null || true
        fi
        
        # Erstelle ein leeres KernelSU Verzeichnis als Workaround
        mkdir -p drivers/kernelsu
        echo "# Empty Kconfig for CI build" > drivers/kernelsu/Kconfig

    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libncurses-dev \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          wget \
          curl \
          tar \
          unzip \
          git \
          bc \
          rsync \
          python3 \
          python3-pip \
          bsdiff \
          zstd \
          cpio \
          abootimg \
          lz4 \
          lzop
        
        sudo ln -sf /usr/bin/python3 /usr/bin/python

    - name: Prepare automated build
      run: |
        # Erstelle Skript für nicht-interaktiven Build
        cat > build_kernel.sh << 'EOF'
        #!/bin/bash
        
        echo "=== Starting Automated Kernel Build ==="
        
        # Export build parameters (wie in apollo.sh erwartet)
        export CR_TARGET=1      # starlte
        export CR_COMPILER=3    # clang 18
        export CR_SELINUX=1     # permissive
        export CR_KSU=n         # no kernel su
        export CR_CLEAN=y       # clean build
        
        # Temporäre Umgebungsvariablen für make
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        echo "Parameters:"
        echo "  Target: starlte"
        echo "  Compiler: clang 18"
        echo "  SELinux: permissive"
        echo "  KernelSU: disabled"
        echo "  Clean build: yes"
        
        # Starte apollo.sh im Hintergrund und füttere Eingaben
        {
          echo "1"  # Target: starlte
          sleep 1
          echo "3"  # Compiler: clang 18
          sleep 1
          echo "1"  # SELinux: permissive
          sleep 1
          echo "n"  # KernelSU: no
          sleep 1
          echo "y"  # Clean build: yes
          sleep 3
          # Für Toolchain-Download prompt
          echo "y"
          # Warte auf weitere Prompts
          sleep 60
          echo "y"
        } | ./apollo.sh 2>&1 | tee build.log &
        
        APOLLO_PID=$!
        
        # Warte maximal 30 Minuten
        timeout 1800 tail --pid=$APOLLO_PID -f /dev/null
        
        if [ $? -eq 124 ]; then
          echo "❌ Build timeout after 30 minutes"
          kill $APOLLO_PID 2>/dev/null
          exit 1
        fi
        
        wait $APOLLO_PID
        BUILD_EXIT=$?
        
        if [ $BUILD_EXIT -eq 0 ]; then
          echo "✅ Build process completed"
        else
          echo "❌ Build failed with exit code: $BUILD_EXIT"
          echo "=== Last 50 lines of build.log ==="
          tail -50 build.log
          exit 1
        fi
        EOF
        
        chmod +x build_kernel.sh
        chmod +x apollo.sh

    - name: Build kernel
      env:
        CLEAN_BUILD: ${{ github.event.inputs.clean_build || 'y' }}
      run: |
        echo "Starting build with clean=$CLEAN_BUILD"
        ./build_kernel.sh

    - name: Check build artifacts
      run: |
        echo "=== Checking build artifacts ==="
        
        # Prüfe verschiedene mögliche Output-Orte
        ARTIFACTS_FOUND=false
        
        # Prüfe Apollo/Product/
        if [ -d "Apollo/Product" ] && [ "$(ls -A Apollo/Product/*.img 2>/dev/null)" ]; then
          echo "✅ Kernel images found in Apollo/Product/:"
          ls -lh Apollo/Product/*.img
          ARTIFACTS_FOUND=true
        fi
        
        # Prüfe Apollo/Out/
        if [ -d "Apollo/Out" ] && [ "$(ls -A Apollo/Out/*.img 2>/dev/null)" ]; then
          echo "✅ Kernel images found in Apollo/Out/:"
          ls -lh Apollo/Out/*.img
          ARTIFACTS_FOUND=true
        fi
        
        # Prüfe arch/arm64/boot/ für Image oder zImage
        if [ -f "arch/arm64/boot/Image" ] || [ -f "arch/arm64/boot/zImage" ]; then
          echo "✅ Kernel binary compiled:"
          ls -lh arch/arm64/boot/Image arch/arm64/boot/zImage 2>/dev/null || true
          ARTIFACTS_FOUND=true
        fi
        
        if [ "$ARTIFACTS_FOUND" = false ]; then
          echo "❌ No kernel artifacts found!"
          echo "Build likely failed during compilation."
          echo "=== Checking build logs ==="
          if [ -f "build.log" ]; then
            echo "Last 100 lines of build.log:"
            tail -100 build.log
          fi
          exit 1
        else
          echo "✅ Build successful - artifacts found!"
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build-${{ github.sha }}
        path: |
          Apollo/Product/
          Apollo/Out/
          arch/arm64/boot/Image
          arch/arm64/boot/zImage
          build.log
        retention-days: 7
