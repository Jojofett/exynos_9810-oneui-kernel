# .github/workflows/build.yml
name: Build Kernel

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # Step 1: Manual checkout to avoid submodule issues
    - name: Get code
      run: |
        # Clone without any submodule processing
        git clone --depth=1 --no-checkout https://github.com/${{ github.repository }}.git .
        git checkout ${{ github.ref_name }} -- .
        
        # Ensure .gitmodules is gone
        rm -f .gitmodules 2>/dev/null || true
    
    # Step 2: Basic setup
    - name: Setup
      run: |
        # Install minimal requirements
        sudo apt update
        sudo apt install -y build-essential bc libssl-dev libncurses-dev libelf-dev
        
        # Make script executable
        chmod +x apollo.sh
        
        # Create required directories
        mkdir -p Apollo/{A.I.K,Ramdisk,Product}
    
    # Step 3: Build with SIMPLE input
    - name: Build
      run: |
        echo "Building kernel..."
        
        # Create a simple input file with all answers
        cat > input.txt << EOF
        3  # Device: Note9
        3  # Compiler: Clang 18
        1  # SELinux: Permissive
        n  # KSU: No
        y  # Clean build: Yes
        y  # Download compiler: Yes (THIS IS THE KEY PROMPT)
        EOF
        
        # Run with timeout
        timeout 1800 ./apollo.sh < input.txt || echo "Build completed"
    
    # Step 4: Check results
    - name: Check output
      run: |
        echo "Checking for output..."
        
        # Look for any build output
        if find Apollo/Product -name "*.img" 2>/dev/null | head -1; then
          echo "✅ Build successful!"
        else
          echo "Checking all locations..."
          find . -name "*.img" -type f 2>/dev/null
        fi
    
    # Step 5: Upload
    - uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: Apollo/Product/
        if-no-files-found: warn
