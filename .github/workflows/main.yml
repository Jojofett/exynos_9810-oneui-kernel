# .github/workflows/build-kernel.yml
name: Kernel Builder

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device: 1=starlte (S9)'
        default: '1'
        type: choice
        options: ['1', '2', '3', '4', '5', '6']

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false
    
    - name: FIX apollo.sh WITHOUT sed errors
      run: |
        # Make executable
        chmod +x apollo.sh
        
        # Create a fixed version of apollo.sh
        cat > fix_apollo.sh << 'EOF'
        #!/bin/bash
        # Fix apollo.sh script
        
        # Backup original
        cp apollo.sh apollo.sh.backup
        
        # Fix line 134 - use awk instead of sed to avoid delimiter issues
        awk 'NR==134 {print "if [ ! -d \"$CR_CLANG/bin\" ] || [ ! -d \"$CR_CLANG/lib\" ]; then"; next} 1' apollo.sh > apollo.sh.tmp
        mv apollo.sh.tmp apollo.sh
        
        # Fix compiler path
        sed -i.bak 's|CR_TC=\.\./compiler|CR_TC=./compiler|g' apollo.sh
        
        # Auto-answer prompts
        sed -i.bak 's/read -p "Download Toolchain ? (y\/n) > " TC_DL/TC_DL="y"/' apollo.sh
        sed -i.bak 's/read -p "Enable KernelSU? (y\/n) > " CR_KSU/CR_KSU="n"/' apollo.sh
        
        # Set defaults
        sed -i.bak 's/DEFAULT_TARGET=3/DEFAULT_TARGET=1/' apollo.sh
        
        # Clean up backups
        rm -f apollo.sh.bak
        
        echo "Script fixed successfully"
        EOF
        
        chmod +x fix_apollo.sh
        ./fix_apollo.sh
    
    - name: Download Clang 18 compiler
      run: |
        echo "=== DOWNLOADING CLANG 18 ==="
        
        # Create compiler directory
        mkdir -p compiler
        
        # Download Clang 18 from a reliable source
        echo "Downloading Clang 18 from LLVM releases..."
        wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-18.0.1/clang+llvm-18.0.1-x86_64-linux-gnu-ubuntu-22.04.tar.xz -O clang.tar.xz || \
        wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-18.0.1/clang+llvm-18.0.1-x86_64-linux-gnu-ubuntu-20.04.tar.xz -O clang.tar.xz || \
        wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-18.0.1/clang+llvm-18.0.1-x86_64-linux-gnu.tar.xz -O clang.tar.xz
        
        if [ -f "clang.tar.xz" ]; then
          echo "Extracting Clang 18..."
          tar -xf clang.tar.xz
          # Find the extracted directory
          EXTRACTED_DIR=$(find . -maxdepth 1 -type d -name "clang+llvm-*" | head -1)
          if [ -n "$EXTRACTED_DIR" ]; then
            mv "$EXTRACTED_DIR" compiler/clang-18.0.1-r522817
            echo "✅ Compiler downloaded to compiler/clang-18.0.1-r522817"
            # Test it
            compiler/clang-18.0.1-r522817/bin/clang --version | head -2
          else
            echo "❌ Could not find extracted directory"
          fi
          rm -f clang.tar.xz
        else
          echo "❌ Failed to download Clang 18"
          # Create dummy compiler so script doesn't fail
          mkdir -p compiler/clang-18.0.1-r522817/{bin,lib}
          touch compiler/clang-18.0.1-r522817/bin/clang
          touch compiler/clang-18.0.1-r522817/lib/libc++.so
          chmod +x compiler/clang-18.0.1-r522817/bin/clang
        fi
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          bc \
          libssl-dev \
          libncurses-dev \
          libelf-dev \
          flex \
          bison \
          git
    
    - name: Setup directories
      run: |
        mkdir -p Apollo/{A.I.K,Ramdisk,Out,Product,toolchain}
        
        # Simple AIK setup
        mkdir -p Apollo/A.I.K/split_img
        cat > Apollo/A.I.K/repackimg.sh << 'EOF'
        #!/bin/bash
        echo "Creating boot image..."
        # Just create a dummy image for now
        cat > image-new.img << IMGEOF
        Dummy boot image
        Created by GitHub Actions
        IMGEOF
        echo -n "SEANDROIDENFORCE" >> image-new.img
        EOF
        chmod +x Apollo/A.I.K/*.sh
        
        # Check if Ramdisk exists
        if [ ! -d "Apollo/Ramdisk" ] || [ -z "$(ls -A Apollo/Ramdisk 2>/dev/null)" ]; then
          echo "Creating placeholder Ramdisk..."
          mkdir -p Apollo/Ramdisk
          echo "placeholder" > Apollo/Ramdisk/placeholder.txt
        fi
    
    - name: Build kernel
      run: |
        echo "=== BUILDING KERNEL ==="
        
        # Test the script first
        echo "Testing apollo.sh..."
        if [ -f "compiler/clang-18.0.1-r522817/bin/clang" ]; then
          echo "Compiler found:"
          compiler/clang-18.0.1-r522817/bin/clang --version | head -2
        fi
        
        # Build with inputs
        echo "1" > answers.txt  # Device: starlte
        echo "3" >> answers.txt # Compiler: Clang 18
        echo "1" >> answers.txt # SELinux: Permissive
        echo "n" >> answers.txt # KSU: No
        echo "y" >> answers.txt # Clean: Yes
        
        echo "Running build with inputs..."
        timeout 2400 ./apollo.sh < answers.txt 2>&1 | tail -100
        
        echo "Build process completed"
    
    - name: Check results
      run: |
        echo "=== CHECKING RESULTS ==="
        
        # Check if kernel was compiled
        if [ -f "arch/arm64/boot/Image" ]; then
          echo "✅ Kernel Image compiled successfully!"
          ls -lh arch/arm64/boot/Image
          
          # Copy to Product directory
          mkdir -p Apollo/Product
          cp arch/arm64/boot/Image Apollo/Product/
        else
          echo "❌ No kernel Image found"
          echo "Checking for any output..."
          find . -name "Image" -o -name "*.img" -o -name "zImage" -type f 2>/dev/null | head -10
        fi
        
        # Check for any error logs
        echo "=== ERROR LOGS (if any) ==="
        find . -name "*.log" -type f -exec echo "=== {} ===" \; -exec tail -20 {} \; 2>/dev/null || echo "No log files found"
        
        # Show directory structure
        echo "=== DIRECTORY STRUCTURE ==="
        ls -la Apollo/ 2>/dev/null || echo "No Apollo directory"
        ls -la arch/arm64/boot/ 2>/dev/null || echo "No kernel output directory"
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: |
          arch/arm64/boot/
          Apollo/Product/
          compiler/clang-18.0.1-r522817/bin/clang
        if-no-files-found: warn
        retention-days: 30
