name: Kernel Builder

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device: 1=starlte (S9), 2=star2lte (S9+), 3=crownlte (Note9), 4=starltekor, 5=star2ltekor, 6=crownltekor'
        default: '1'
        type: choice
        options: ['1', '2', '3', '4', '5', '6']
      compiler:
        description: 'Compiler choice (1-8)'
        default: '3'
        type: choice
        options: ['1', '2', '3', '4', '5', '6', '7', '8']
      selinux:
        description: 'SELinux mode'
        default: '2'
        type: choice
        options: ['1', '2']
      ksu:
        description: 'Enable KernelSU'
        default: 'y'
        type: choice
        options: ['y', 'n']
      clean_build:
        description: 'Clean build'
        default: 'n'
        type: choice
        options: ['y', 'n']

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: false
        ref: 4.9.337-oneui
    
    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y build-essential bc libssl-dev libncurses-dev libelf-dev flex bison git wget tar xz-utils python3 make gcc g++ cpio abootimg dos2unix zstd expect bsdiff
    
    - name: Fix KernelSU
      run: |
        rm -rf drivers/kernelsu 2>/dev/null || true
        mkdir -p drivers/kernelsu
        echo 'config KSU' > drivers/kernelsu/Kconfig
        echo '	bool "KernelSU"' >> drivers/kernelsu/Kconfig
        echo '	default n' >> drivers/kernelsu/Kconfig
    
    - name: Fix Apollo.sh compiler paths
      run: |
        # Fix the bug in Apollo.sh for Neutron Clang 19 path
        # Change from neutron-clang-18.0.0 to neutron-clang-19.0.0 for option 6
        sed -i 's|if \[ \$CR_COMPILER = "6" \]; then|if [ $CR_COMPILER = "6" ]; then\nCR_CLANG_URL=https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst\nCR_CLANG=$CR_TC/neutron-clang-19.0.0\nfi\nif [ $CR_COMPILER = "6" ]; then|' apollo.sh
        
        # Also fix the duplicate line for option 6
        sed -i 's|if \[ \$CR_COMPILER = "6" \]; then\nCR_CLANG_URL=https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst\nCR_CLANG=\$CR_TC/neutron-clang-18.0.0\nfi||' apollo.sh
        
        # Let's rewrite the entire BUILD_COMPILER function section for clarity
        # First backup the original
        cp apollo.sh apollo.sh.backup
        
        # Create a fixed version
        cat > fix_compiler.sh << 'EOF'
        #!/bin/bash
        # Read the file
        content=$(cat apollo.sh.backup)
        
        # Find and replace the problematic section
        # Replace the entire BUILD_COMPILER function
        new_content=$(echo "$content" | sed -n '
        /^BUILD_COMPILER()/,/^}/ {
            # Print the function start
            /^BUILD_COMPILER()/p
            
            # Skip to the compiler selection
            :skip
            n
            /^}/b endfunc
            /if \[ \$CR_COMPILER = "1" \]; then/b startcomp
            b skip
            
            :startcomp
            # Print from here until the function end
            :printcomp
            p
            n
            /^}/b endfunc
            b printcomp
            
            :endfunc
            p
        }
        !/^BUILD_COMPILER()/,/^}/p
        ')
        
        echo "$new_content" > apollo.sh
        EOF
        
        chmod +x fix_compiler.sh
        ./fix_compiler.sh || echo "Using manual fix instead"
        
        # Manual fix if automated doesn't work
        # Find and fix the specific line for compiler 6
        sed -i 's|if \[ \$CR_COMPILER = "6" \]; then\nCR_CLANG_URL=https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst\nCR_CLANG=\$CR_TC/neutron-clang-18.0.0|if [ $CR_COMPILER = "6" ]; then\nCR_CLANG_URL=https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst\nCR_CLANG=$CR_TC/neutron-clang-19.0.0|' apollo.sh
    
    - name: Setup directories and patching
      run: |
        chmod +x apollo.sh
        dos2unix apollo.sh 2>/dev/null || true
        mkdir -p Apollo/{A.I.K,Ramdisk,Out,Product,toolchain}
        mkdir -p compiler
        
        # Create minimal A.I.K scripts
        echo "#!/bin/bash" > Apollo/A.I.K/repackimg.sh
        echo 'echo "Repacking image..."' >> Apollo/A.I.K/repackimg.sh
        echo 'sleep 2' >> Apollo/A.I.K/repackimg.sh
        echo 'touch image-new.img' >> Apollo/A.I.K/repackimg.sh
        echo 'exit 0' >> Apollo/A.I.K/repackimg.sh
        chmod +x Apollo/A.I.K/repackimg.sh
        
        echo "#!/bin/bash" > Apollo/A.I.K/cleanup.sh
        echo 'echo "Cleaning up..."' >> Apollo/A.I.K/cleanup.sh
        echo 'rm -f image-new.img 2>/dev/null' >> Apollo/A.I.K/cleanup.sh
        chmod +x Apollo/A.I.K/cleanup.sh
        
        mkdir -p Apollo/A.I.K/split_img
        
        # Patch apollo.sh for non-interactive mode
        sed -i 's|CR_TC=\.\./compiler|CR_TC=./compiler|g' apollo.sh
        sed -i 's|CR_TC=../toolchain|CR_TC=./Apollo/toolchain|g' apollo.sh
        
        # Fix the interactive prompts
        sed -i 's/read -p "Download Toolchain ? (y\/n) > " TC_DL/TC_DL="y"/' apollo.sh
        sed -i 's/read -p "Please select your build target (1-8) > "/# read target/' apollo.sh
        sed -i 's/read -p "Please select your compiler (1-7) > "/# read compiler/' apollo.sh
        sed -i 's/read -p "Please select your SElinux mode (1-2) > "/# read selinux/' apollo.sh
        sed -i 's/read -p "Enable KernelSU? (y\/n) > "/# read ksu/' apollo.sh
        sed -i 's/read -p "Clean Builds? (y\/n) > "/# read clean/' apollo.sh
        
        # Add forced variable setting at the beginning of the script
        sed -i '/^# Main Dir/a\# Forced variables for GitHub Actions\nCR_TARGET=$1\nCR_COMPILER=$2\nCR_SELINUX=$3\nCR_KSU=$4\nCR_CLEAN=$5\n' apollo.sh
    
    - name: Pre-download compilers
      run: |
        echo "Setting up all compilers to avoid download prompts..."
        
        # Download all compilers that might be needed
        COMPILERS=(
          "1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/llvm-r416183/clang-r416183.tar.gz clang-12.0.4-r416183"
          "2 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/llvm-r450784/clang-r450784b.tar.gz clang-14.0.4-r450784"
          "3 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/llvm-r522817/clang-r522817.tar.gz clang-18.0.1-r522817"
          "4 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz clang-20.0.0-r547379"
          "5 https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/05012024/neutron-clang-05012024.tar.zst neutron-clang-18.0.0"
          "6 https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst neutron-clang-19.0.0"
        )
        
        for comp_info in "${COMPILERS[@]}"; do
          read -r num url dir <<< "$comp_info"
          echo "Setting up compiler $num: $dir"
          
          if [ ! -d "compiler/$dir/bin" ]; then
            mkdir -p "compiler/$dir"
            echo "Downloading $url..."
            
            if [[ $url == *".tar.zst" ]]; then
              wget -q --show-progress "$url" -O /tmp/compiler.tar.zst
              tar --use-compress-program=unzstd -xf /tmp/compiler.tar.zst -C "compiler/$dir"
              rm -f /tmp/compiler.tar.zst
              
              # Apply Neutron patches if needed
              if [[ $num == "5" ]] || [[ $num == "6" ]]; then
                cd "compiler/$dir"
                curl -s https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman | bash -s -- --patch=glibc || true
                cd -
              fi
            else
              wget -q --show-progress "$url" -O /tmp/compiler.tar.gz
              tar -xzf /tmp/compiler.tar.gz -C "compiler/$dir"
              rm -f /tmp/compiler.tar.gz
            fi
            echo "Compiler $dir setup complete"
          else
            echo "Compiler $dir already exists"
          fi
        done
        
        # For compiler 7 and 8, create dummy directories
        mkdir -p compiler/neutron-clang-20.0.0/bin
        mkdir -p Apollo/toolchain/clang-custom/bin
    
    - name: Direct build with parameters
      run: |
        export TERM=xterm
        
        DEVICE=${{ github.event.inputs.device }}
        COMPILER=${{ github.event.inputs.compiler }}
        SELINUX=${{ github.event.inputs.selinux }}
        KSU=${{ github.event.inputs.ksu }}
        CLEAN=${{ github.event.inputs.clean_build }}
        
        echo "Build parameters:"
        echo "Device: $DEVICE"
        echo "Compiler: $COMPILER"
        echo "SELinux: $SELINUX"
        echo "KSU: $KSU"
        echo "Clean: $CLEAN"
        
        # Create a simple wrapper script that calls apollo.sh with parameters
        cat > build_kernel.sh << 'EOF'
        #!/bin/bash
        set -e
        
        DEVICE=$1
        COMPILER=$2
        SELINUX=$3
        KSU=$4
        CLEAN=$5
        
        echo "Running with: $DEVICE $COMPILER $SELINUX $KSU $CLEAN"
        
        # Create input file
        echo -e "$DEVICE\n$COMPILER\n$SELINUX\n$KSU\n$CLEAN" > input.txt
        
        # Run apollo.sh with the input
        timeout 3600 bash -c '
          cat input.txt | ./apollo.sh 2>&1 | tee build_output.log
          exit ${PIPESTATUS[0]}
        '
        
        # Check if build was successful
        if [ -f "arch/arm64/boot/Image" ] || [ -f "arch/arm64/boot/zImage" ]; then
          echo "Build successful!"
          exit 0
        else
          echo "Build may have failed - no kernel image found"
          exit 1
        fi
        EOF
        
        chmod +x build_kernel.sh
        
        # Run the build
        ./build_kernel.sh "$DEVICE" "$COMPILER" "$SELINUX" "$KSU" "$CLEAN" || true
        
        # Show tail of build log
        echo "=== Build Log Tail ==="
        tail -100 build_output.log 2>/dev/null || echo "No build log found"
    
    - name: Collect artifacts
      run: |
        mkdir -p artifacts
        
        # Collect kernel images
        find arch/arm64/boot -name "Image*" -exec cp {} artifacts/ \; 2>/dev/null || true
        find arch/arm64/boot -name "zImage*" -exec cp {} artifacts/ \; 2>/dev/null || true
        find arch/arm64/boot -name "*.dtb" -exec cp {} artifacts/ \; 2>/dev/null || true
        
        # Collect boot images
        find Apollo/Out -name "*.img" -exec cp {} artifacts/ \; 2>/dev/null || true
        find Apollo/Product -name "*.img" -exec cp {} artifacts/ \; 2>/dev/null || true
        find . -name "*.img" -maxdepth 2 -exec cp {} artifacts/ \; 2>/dev/null || true
        
        # Collect logs
        cp build_output.log artifacts/ 2>/dev/null || true
        cp input.txt artifacts/ 2>/dev/null || true
        
        # List what we found
        echo "=== Artifacts collected ==="
        ls -la artifacts/ 2>/dev/null || echo "No artifacts found"
        
        # Create build info
        echo "Build Parameters:" > artifacts/build_info.txt
        echo "Device: ${{ github.event.inputs.device }}" >> artifacts/build_info.txt
        echo "Compiler: ${{ github.event.inputs.compiler }}" >> artifacts/build_info.txt
        echo "SELinux: ${{ github.event.inputs.selinux }}" >> artifacts/build_info.txt
        echo "KernelSU: ${{ github.event.inputs.ksu }}" >> artifacts/build_info.txt
        echo "Clean Build: ${{ github.event.inputs.clean_build }}" >> artifacts/build_info.txt
        echo "Date: $(date)" >> artifacts/build_info.txt
        echo "Workflow Run: $GITHUB_RUN_ID" >> artifacts/build_info.txt
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build-${{ github.event.inputs.compiler }}-${{ github.event.inputs.device }}
        path: artifacts/
        if-no-files-found: warn
