# .github/workflows/build-kernel.yml
name: Kernel Builder

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device: 1=starlte (S9)'
        default: '1'
        type: choice
        options: ['1', '2', '3', '4', '5', '6']

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false
        ref: 4.9.337-oneui
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          bc \
          libssl-dev \
          libncurses-dev \
          libelf-dev \
          flex \
          bison \
          git \
          wget \
          tar \
          gzip \
          xz-utils \
          python3 \
          make \
          gcc \
          g++ \
          cpio \
          abootimg \
          dos2unix \
          rsync
    
    - name: Download Android Clang r522817
      run: |
        echo "=== DOWNLOADING ANDROID CLANG r522817 ==="
        
        # Create compiler directory
        mkdir -p compiler
        
        # Download from the exact source you specified
        echo "Downloading from: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/llvm-r522817/clang-r522817.tar.gz"
        
        # Use curl with proper redirect handling
        curl -L -o clang-r522817.tar.gz \
          "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/llvm-r522817/clang-r522817.tar.gz" \
          --retry 3 --retry-delay 5
        
        if [ -f "clang-r522817.tar.gz" ]; then
          echo "Download successful, file size: $(wc -c < clang-r522817.tar.gz) bytes"
          
          # Extract to correct directory
          echo "Extracting Clang r522817..."
          mkdir -p compiler/clang-18.0.1-r522817
          tar -xzf clang-r522817.tar.gz -C compiler/clang-18.0.1-r522817
          
          # Check what was extracted
          echo "Contents of extracted directory:"
          ls -la compiler/clang-18.0.1-r522817/ | head -20
          
          # The Android Clang archive has a specific structure
          # Usually it extracts with bin/, lib/, include/, etc. at the root
          # But let's check and organize if needed
          
          # If bin/ directory exists at root, we're good
          if [ -d "compiler/clang-18.0.1-r522817/bin" ]; then
            echo "✅ Clang directory structure looks correct"
          else
            echo "⚠️  Bin directory not found at root, checking structure..."
            # List all directories and files to understand structure
            find compiler/clang-18.0.1-r522817 -type f -name "clang" | head -5
            find compiler/clang-18.0.1-r522817 -type d | head -10
          fi
          
          # Test the compiler
          if [ -f "compiler/clang-18.0.1-r522817/bin/clang" ]; then
            echo "✅ Clang binary found"
            compiler/clang-18.0.1-r522817/bin/clang --version | head -3
          else
            # Try to find clang anywhere in the extracted files
            CLANG_PATH=$(find compiler/clang-18.0.1-r522817 -type f -name "clang" | head -1)
            if [ -n "$CLANG_PATH" ]; then
              echo "Found clang at: $CLANG_PATH"
              # Create bin directory and move/symlink clang there
              mkdir -p compiler/clang-18.0.1-r522817/bin
              CLANG_DIR=$(dirname "$CLANG_PATH")
              if [ "$CLANG_DIR" != "compiler/clang-18.0.1-r522817/bin" ]; then
                # Move all binaries to bin directory
                find "$CLANG_DIR" -maxdepth 1 -type f \( -name "clang" -o -name "clang++" -o -name "ld.lld" \) -exec mv {} compiler/clang-18.0.1-r522817/bin/ \;
                # If we moved the directory, try to move lib directory too
                if [ -d "$CLANG_DIR/../lib" ]; then
                  mv "$CLANG_DIR/../lib" compiler/clang-18.0.1-r522817/ 2>/dev/null || true
                fi
              fi
              # Test again
              if [ -f "compiler/clang-18.0.1-r522817/bin/clang" ]; then
                compiler/clang-18.0.1-r522817/bin/clang --version | head -3
              fi
            else
              echo "❌ Clang binary not found in archive"
              echo "Listing archive contents:"
              tar -tzf clang-r522817.tar.gz | head -30
            fi
          fi
          
          # Clean up
          rm -f clang-r522817.tar.gz
          
        else
          echo "❌ Failed to download Clang r522817"
          echo "Trying alternative Google Storage URL..."
          
          # Try the Google Storage URL as fallback
          wget -q --timeout=30 --tries=3 \
            "https://storage.googleapis.com/android-llvm-toolchain/llvm-r522817/clang-r522817.tar.gz" \
            -O clang-r522817.tar.gz
          
          if [ -f "clang-r522817.tar.gz" ]; then
            echo "Alternative download successful"
            mkdir -p compiler/clang-18.0.1-r522817
            tar -xzf clang-r522817.tar.gz -C compiler/clang-18.0.1-r522817
            rm -f clang-r522817.tar.gz
          else
            echo "❌ All download attempts failed"
            exit 1
          fi
        fi
        
        # Final verification
        echo "=== FINAL VERIFICATION ==="
        echo "Compiler directory structure:"
        ls -la compiler/clang-18.0.1-r522817/
        if [ -d "compiler/clang-18.0.1-r522817/bin" ]; then
          echo "Bin directory contents:"
          ls -la compiler/clang-18.0.1-r522817/bin/ | head -10
        fi
    
    - name: Prepare build environment
      run: |
        echo "=== PREPARING BUILD ENVIRONMENT ==="
        
        # Make apollo.sh executable
        chmod +x apollo.sh
        
        # Fix line endings if needed
        dos2unix apollo.sh 2>/dev/null || true
        
        # Create necessary directories
        mkdir -p Apollo/{A.I.K,Ramdisk,Out,Product,toolchain}
        
        # Create minimal AIK scripts
        cat > Apollo/A.I.K/repackimg.sh << 'EOF'
        #!/bin/bash
        echo "Repacking boot image..."
        # This is a simplified version for CI
        if [ -f "../Product/Image.gz-dtb" ]; then
          cp ../Product/Image.gz-dtb split_img/
          echo "Kernel: Image.gz-dtb" > boot.img
          echo -n "SEANDROIDENFORCE" >> boot.img
          mv boot.img image-new.img
          echo "Boot image created: image-new.img"
        else
          echo "No kernel image found"
          touch image-new.img
        fi
        EOF
        
        chmod +x Apollo/A.I.K/*.sh
        
        # Create minimal ramdisk if none exists
        if [ ! -d "Apollo/Ramdisk" ] || [ -z "$(ls -A Apollo/Ramdisk 2>/dev/null)" ]; then
          echo "Creating minimal ramdisk structure..."
          mkdir -p Apollo/Ramdisk
          cat > Apollo/Ramdisk/init.rc << 'EOF'
        # Minimal init.rc
        on early-init
            start ueventd
        
        on init
            symlink /system/bin /bin
        
        service ueventd /sbin/ueventd
            critical
            seclabel u:r:ueventd:s0
        EOF
        fi
        
        # Verify compiler path
        echo "Compiler path verification:"
        if [ -f "compiler/clang-18.0.1-r522817/bin/clang" ]; then
          echo "✅ Clang is available at: compiler/clang-18.0.1-r522817/bin/clang"
        else
          echo "❌ Clang not found at expected location"
          find compiler/ -name "clang" -type f 2>/dev/null
        fi
    
    - name: Configure and build kernel
      run: |
        echo "=== CONFIGURING AND BUILDING KERNEL ==="
        
        # Set environment variables
        export ARCH=arm64
        export SUBARCH=arm64
        
        # First, let's check if we can run apollo.sh directly
        echo "Testing apollo.sh..."
        
        # Create an automated input for apollo.sh
        cat > auto_input.txt << EOF
        1
        3
        1
        n
        y
        EOF
        
        # Make sure the script is executable
        chmod +x apollo.sh
        
        # Check the script for syntax errors
        echo "Checking script syntax..."
        bash -n apollo.sh && echo "✅ Script syntax is valid"
        
        # Patch the script if needed (only critical fixes)
        echo "Applying critical patches to apollo.sh..."
        
        # Backup original
        cp apollo.sh apollo.sh.backup
        
        # Fix 1: Ensure CR_TC points to current directory
        sed -i 's|CR_TC=\.\./compiler|CR_TC=./compiler|g' apollo.sh
        
        # Fix 2: Auto-answer the toolchain download question since we already have it
        sed -i 's/read -p "Download Toolchain ? (y\/n) > " TC_DL/TC_DL="n"/' apollo.sh
        
        # Fix 3: Skip KernelSU
        sed -i 's/read -p "Enable KernelSU? (y\/n) > " CR_KSU/CR_KSU="n"/' apollo.sh
        
        echo "✅ Applied critical patches"
        
        # Run the build with a timeout
        echo "Starting kernel build..."
        echo "Build will timeout after 30 minutes"
        
        # Run apollo.sh with our automated input
        timeout 1800 bash -c "
          echo 'Starting build process...'
          ./apollo.sh < auto_input.txt 2>&1 | tee build_output.log
          echo 'Build process completed'
        " || {
          echo "Build timed out after 30 minutes"
          echo "Last 100 lines of output:"
          tail -100 build_output.log 2>/dev/null || echo "No build output log found"
        }
        
        echo "=== BUILD PROCESS FINISHED ==="
    
    - name: Collect build artifacts
      run: |
        echo "=== COLLECTING ARTIFACTS ==="
        
        # Create artifacts directory
        mkdir -p artifacts
        
        # Check for kernel image
        if [ -f "arch/arm64/boot/Image" ]; then
          echo "✅ Kernel Image found"
          cp arch/arm64/boot/Image artifacts/
          ls -lh artifacts/Image
        fi
        
        if [ -f "arch/arm64/boot/Image.gz-dtb" ]; then
          echo "✅ Image.gz-dtb found"
          cp arch/arm64/boot/Image.gz-dtb artifacts/
        fi
        
        if [ -f "arch/arm64/boot/Image.gz" ]; then
          echo "✅ Image.gz found"
          cp arch/arm64/boot/Image.gz artifacts/
        fi
        
        # Check Apollo/Product directory
        if [ -d "Apollo/Product" ]; then
          echo "Apollo/Product contents:"
          ls -la Apollo/Product/
          cp -r Apollo/Product/* artifacts/ 2>/dev/null || true
        fi
        
        # Save build log
        if [ -f "build_output.log" ]; then
          echo "Saving build log..."
          cp build_output.log artifacts/
          # Show last 50 lines for debugging
          echo "=== LAST 50 LINES OF BUILD LOG ==="
          tail -50 build_output.log
        fi
        
        # Save compiler info
        if [ -f "compiler/clang-18.0.1-r522817/bin/clang" ]; then
          compiler/clang-18.0.1-r522817/bin/clang --version > artifacts/clang_version.txt 2>&1
        fi
        
        # List all artifacts
        echo "=== ARTIFACTS COLLECTED ==="
        find artifacts/ -type f 2>/dev/null | while read file; do
          echo "- $(basename "$file") ($(wc -c < "$file") bytes)"
        done || echo "No artifacts found"
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: kernel-build-${{ github.run_id }}
        path: artifacts/
        if-no-files-found: warn
        retention-days: 7
