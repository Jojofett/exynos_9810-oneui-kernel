# .github/workflows/build-kernel.yml
name: Kernel Builder

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device: 1=starlte (S9)'
        default: '1'
        type: choice
        options: ['1', '2', '3', '4', '5', '6']

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false
        ref: 4.9.337-oneui
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          bc \
          libssl-dev \
          libncurses-dev \
          libelf-dev \
          flex \
          bison \
          git \
          wget \
          tar \
          gzip \
          xz-utils \
          python3 \
          make \
          gcc \
          g++ \
          cpio \
          abootimg \
          dos2unix \
          rsync \
          curl \
          file \
          binutils \
          lz4
    
    - name: Download Android Clang r522817
      run: |
        echo "=== DOWNLOADING ANDROID CLANG r522817 ==="
        
        # Create compiler directory
        mkdir -p compiler
        
        # Download from the exact source you specified
        echo "Downloading from: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/llvm-r522817/clang-r522817.tar.gz"
        
        # Use curl with proper redirect handling
        curl -L -o clang-r522817.tar.gz \
          "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/llvm-r522817/clang-r522817.tar.gz" \
          --retry 3 --retry-delay 5
        
        if [ -f "clang-r522817.tar.gz" ]; then
          echo "✅ Download successful, file size: $(wc -c < clang-r522817.tar.gz) bytes"
          
          # Extract to correct directory
          echo "Extracting Clang r522817..."
          mkdir -p compiler/clang-18.0.1-r522817
          tar -xzf clang-r522817.tar.gz -C compiler/clang-18.0.1-r522817
          
          # Test the compiler
          if [ -f "compiler/clang-18.0.1-r522817/bin/clang" ]; then
            echo "✅ Clang binary found"
            compiler/clang-18.0.1-r522817/bin/clang --version | head -3
          else
            # Try to find clang anywhere in the extracted files
            CLANG_PATH=$(find compiler/clang-18.0.1-r522817 -type f -name "clang" | head -1)
            if [ -n "$CLANG_PATH" ]; then
              echo "Found clang at: $CLANG_PATH"
              # Create bin directory and move clang there
              mkdir -p compiler/clang-18.0.1-r522817/bin
              CLANG_DIR=$(dirname "$CLANG_PATH")
              if [ "$CLANG_DIR" != "compiler/clang-18.0.1-r522817/bin" ]; then
                find "$CLANG_DIR" -maxdepth 1 -type f \( -name "clang*" -o -name "ld.lld" \) -exec mv {} compiler/clang-18.0.1-r522817/bin/ \;
              fi
            fi
          fi
          
          # Clean up
          rm -f clang-r522817.tar.gz
          
          # Final verification
          echo "=== FINAL VERIFICATION ==="
          if [ -f "compiler/clang-18.0.1-r522817/bin/clang" ]; then
            echo "✅ Clang ready at: compiler/clang-18.0.1-r522817/bin/clang"
            ls -la compiler/clang-18.0.1-r522817/bin/clang*
          else
            echo "❌ Clang binary not found"
            exit 1
          fi
          
        else
          echo "❌ Failed to download Clang r522817"
          exit 1
        fi
    
    - name: Prepare kernel build environment
      run: |
        echo "=== PREPARING KERNEL BUILD ENVIRONMENT ==="
        
        # Make apollo.sh executable
        chmod +x apollo.sh
        
        # Fix line endings if needed
        dos2unix apollo.sh 2>/dev/null || true
        
        # Create necessary directories
        mkdir -p Apollo/{A.I.K,Ramdisk,Out,Product,toolchain}
        mkdir -p Apollo/A.I.K/split_img
        
        # Create minimal AIK scripts
        cat > Apollo/A.I.K/repackimg.sh << 'EOF'
        #!/bin/bash
        echo "Creating boot image..."
        # Create a dummy boot image
        dd if=/dev/zero of=boot.img bs=1M count=10 2>/dev/null
        echo -n "SEANDROIDENFORCE" >> boot.img
        mv boot.img image-new.img
        echo "✅ Boot image created: image-new.img"
        EOF
        
        cat > Apollo/A.I.K/unpackimg.sh << 'EOF'
        #!/bin/bash
        echo "AIK unpackimg.sh - placeholder for CI"
        mkdir -p split_img
        EOF
        
        chmod +x Apollo/A.I.K/*.sh
        
        # Create minimal ramdisk if none exists
        if [ ! -d "Apollo/Ramdisk" ] || [ -z "$(ls -A Apollo/Ramdisk 2>/dev/null)" ]; then
          echo "Creating minimal ramdisk structure..."
          mkdir -p Apollo/Ramdisk/{sbin,lib,lib/modules}
          cat > Apollo/Ramdisk/init.rc << 'EOF'
        # Minimal init.rc for CI
        on early-init
            mkdir /dev
            mkdir /proc
            mkdir /sys
        
        on init
            mount tmpfs tmpfs /dev
            mkdir /dev/pts
            mount devpts devpts /dev/pts
        
        service shell /system/bin/sh
            class main
            console
        EOF
          echo "✅ Created minimal ramdisk"
        fi
        
        # Verify compiler path
        echo "Compiler path verification:"
        if [ -f "compiler/clang-18.0.1-r522817/bin/clang" ]; then
          echo "✅ Clang is available at: compiler/clang-18.0.1-r522817/bin/clang"
          compiler/clang-18.0.1-r522817/bin/clang --version | head -2
        else
          echo "❌ Clang not found at expected location"
          exit 1
        fi
    
    - name: Fix KernelSU Kconfig issue
      run: |
        echo "=== FIXING KERNELSU KCONFIG ISSUE ==="
        
        # Check if the problematic line exists
        if [ -f "drivers/Kconfig" ]; then
          echo "Checking drivers/Kconfig..."
          
          # Look for the line that includes kernelsu/Kconfig
          if grep -n "kernelsu/Kconfig" drivers/Kconfig; then
            LINE_NUM=$(grep -n "kernelsu/Kconfig" drivers/Kconfig | cut -d: -f1)
            echo "⚠️ Found KernelSU reference at line $LINE_NUM"
            
            # Create the missing directory and Kconfig file
            echo "Creating KernelSU Kconfig directory and file..."
            mkdir -p drivers/kernelsu
            
            cat > drivers/kernelsu/Kconfig << 'EOF'
# KernelSU configuration
config KSU
	tristate "KernelSU support"
	default n
	help
	  KernelSU is a kernel-based root solution for Android devices.
	  
	  Say N here to disable KernelSU support.
EOF
            
            echo "✅ Created drivers/kernelsu/Kconfig"
            
            # Verify the line in drivers/Kconfig
            echo "Line $LINE_NUM in drivers/Kconfig:"
            sed -n "${LINE_NUM}p" drivers/Kconfig
          else
            echo "✅ No KernelSU reference found in drivers/Kconfig"
          fi
        else
          echo "⚠️ drivers/Kconfig not found"
        fi
        
        # Also check if we need to create the file anyway
        if [ ! -f "drivers/kernelsu/Kconfig" ]; then
          echo "Creating drivers/kernelsu/Kconfig as precaution..."
          mkdir -p drivers/kernelsu
          echo "# Placeholder KernelSU Kconfig for CI" > drivers/kernelsu/Kconfig
          echo "config KSU" >> drivers/kernelsu/Kconfig
          echo "	bool \"KernelSU\"" >> drivers/kernelsu/Kconfig
          echo "	default n" >> drivers/kernelsu/Kconfig
        fi
    
    - name: Patch apollo.sh for automated build
      run: |
        echo "=== PATCHING APOLLO.SH FOR AUTOMATED BUILD ==="
        
        # Backup original
        cp apollo.sh apollo.sh.original
        
        # Apply all necessary patches
        echo "Applying patches..."
        
        # 1. Fix toolchain path (from ../compiler to ./compiler)
        sed -i 's|CR_TC=\.\./compiler|CR_TC=./compiler|g' apollo.sh
        
        # 2. Auto-answer toolchain download question (we already have it)
        sed -i 's/read -p "Download Toolchain ? (y\/n) > " TC_DL/TC_DL="n"/' apollo.sh
        
        # 3. Auto-answer KernelSU question
        sed -i 's/read -p "Enable KernelSU? (y\/n) > " CR_KSU/CR_KSU="n"/' apollo.sh
        
        # 4. Auto-answer clean question
        sed -i 's/read -p "Clean Sources? (y\/n) > " CR_CLEAN/CR_CLEAN="y"/' apollo.sh
        
        # 5. Auto-answer SELinux question
        sed -i 's/read -p "Enable SELinux? (1=Permissive 2=Enforcing) > " CR_SELINUX/CR_SELINUX="1"/' apollo.sh
        
        # 6. Skip interactive device selection (use default)
        sed -i 's/read -p "Select Device > " DEVICE_SELECT/DEVICE_SELECT="1"/' apollo.sh
        
        # 7. Skip interactive compiler selection
        sed -i 's/read -p "Select Compiler > " COMPILER_SELECT/COMPILER_SELECT="3"/' apollo.sh
        
        # 8. Fix line 134 (directory check)
        sed -i '134s/.*/if [ ! -d "$CR_CLANG\/bin" ] || [ ! -d "$CR_CLANG\/lib" ]; then/' apollo.sh
        
        # 9. Add exit on error
        sed -i '1i#!/bin/bash\nset -e' apollo.sh
        
        echo "✅ apollo.sh patched successfully"
        
        # Verify script syntax
        bash -n apollo.sh && echo "✅ Script syntax is valid"
    
    - name: Test kernel configuration
      run: |
        echo "=== TESTING KERNEL CONFIGURATION ==="
        
        # Set environment variables
        export ARCH=arm64
        export SUBARCH=arm64
        
        # First clean any previous builds
        echo "Cleaning previous builds..."
        make clean 2>/dev/null || true
        make mrproper 2>/dev/null || true
        
        # Check if we can create the default config
        echo "Testing defconfig creation..."
        
        # Look for the correct defconfig
        if [ -f "arch/arm64/configs/exynos9810-starlte_defconfig" ]; then
          echo "Found: exynos9810-starlte_defconfig"
          make exynos9810-starlte_defconfig 2>&1 | tail -20
        elif [ -f "arch/arm64/configs/starlte_defconfig" ]; then
          echo "Found: starlte_defconfig"
          make starlte_defconfig 2>&1 | tail -20
        else
          echo "⚠️ No starlte defconfig found, listing available configs..."
          find arch/arm64/configs -name "*starlte*" -o -name "*exynos9810*" | head -10
        fi
        
        # Test if .config was created
        if [ -f ".config" ]; then
          echo "✅ .config created successfully"
          echo "Kernel version:"
          grep "CONFIG_LOCALVERSION=" .config || true
        else
          echo "❌ Failed to create .config"
        fi
    
    - name: Build kernel with apollo.sh
      run: |
        echo "=== BUILDING KERNEL WITH APOLLO.SH ==="
        
        # Set environment variables
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Create input file for apollo.sh (automated answers)
        cat > build_input.txt << 'EOF'
        1
        3
        1
        n
        y
        EOF
        
        echo "Build input prepared:"
        cat build_input.txt
        
        # Make sure apollo.sh is executable
        chmod +x apollo.sh
        
        # Test if apollo.sh can run
        echo "Testing apollo.sh..."
        if ./apollo.sh --help 2>/dev/null | head -5; then
          echo "✅ apollo.sh can execute"
        else
          echo "⚠️ apollo.sh help not available, but script exists"
        fi
        
        # Run the build with timeout (45 minutes)
        echo "Starting kernel build (timeout: 45 minutes)..."
        
        # Capture all output to log file
        timeout 2700 bash -c "
          set -e
          echo '=== BUILD START ==='
          echo 'Timestamp: $(date)'
          echo 'Working dir: $(pwd)'
          echo 'Compiler path: $(pwd)/compiler/clang-18.0.1-r522817/bin/clang'
          
          # Run apollo.sh with automated input
          ./apollo.sh < build_input.txt 2>&1
          
          echo '=== BUILD END ==='
          echo 'Timestamp: $(date)'
        " 2>&1 | tee full_build.log || {
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 124 ]; then
            echo "❌ Build timed out after 45 minutes"
          else
            echo "❌ Build failed with exit code: $EXIT_CODE"
          fi
          
          # Show last 100 lines of log
          echo "=== LAST 100 LINES OF BUILD LOG ==="
          tail -100 full_build.log
        }
        
        echo "Build process completed"
    
    - name: Collect and verify build artifacts
      run: |
        echo "=== COLLECTING AND VERIFYING BUILD ARTIFACTS ==="
        
        # Create artifacts directory
        mkdir -p artifacts
        
        # Check for various kernel image formats
        echo "Searching for kernel images..."
        
        # Image (uncompressed)
        if [ -f "arch/arm64/boot/Image" ]; then
          echo "✅ Kernel Image found"
          cp arch/arm64/boot/Image artifacts/
          file artifacts/Image
          ls -lh artifacts/Image
        fi
        
        # Image.gz
        if [ -f "arch/arm64/boot/Image.gz" ]; then
          echo "✅ Image.gz found"
          cp arch/arm64/boot/Image.gz artifacts/
          ls -lh artifacts/Image.gz
        fi
        
        # Image.gz-dtb
        if [ -f "arch/arm64/boot/Image.gz-dtb" ]; then
          echo "✅ Image.gz-dtb found"
          cp arch/arm64/boot/Image.gz-dtb artifacts/
          ls -lh artifacts/Image.gz-dtb
        fi
        
        # zImage
        if [ -f "arch/arm64/boot/zImage" ]; then
          echo "✅ zImage found"
          cp arch/arm64/boot/zImage artifacts/
          ls -lh artifacts/zImage
        fi
        
        # Check for any image in Apollo/Product
        if [ -d "Apollo/Product" ]; then
          echo "Apollo/Product contents:"
          ls -la Apollo/Product/
          
          # Copy everything from Product
          cp -r Apollo/Product/* artifacts/ 2>/dev/null || true
          
          # Check for boot images
          find Apollo/Product -name "*.img" -type f 2>/dev/null | while read img; do
            echo "Found boot image: $img"
            cp "$img" artifacts/ 2>/dev/null || true
          done
        fi
        
        # Save build logs
        echo "Saving build logs..."
        
        if [ -f "full_build.log" ]; then
          cp full_build.log artifacts/
          echo "=== BUILD SUMMARY ===" >> artifacts/build_summary.txt
          echo "Build date: $(date)" >> artifacts/build_summary.txt
          echo "Git commit: $(git log -1 --oneline 2>/dev/null || echo 'unknown')" >> artifacts/build_summary.txt
          
          # Extract success/failure info
          if tail -20 full_build.log | grep -q "Kernel:.*arch/arm64/boot/Image"; then
            echo "Status: SUCCESS" >> artifacts/build_summary.txt
          else
            echo "Status: FAILED" >> artifacts/build_summary.txt
          fi
        fi
        
        # Save compiler info
        if [ -f "compiler/clang-18.0.1-r522817/bin/clang" ]; then
          compiler/clang-18.0.1-r522817/bin/clang --version > artifacts/clang_version.txt 2>&1
        fi
        
        # Save kernel version info
        if [ -f ".config" ]; then
          grep "CONFIG_LOCALVERSION\|LINUX_VERSION_CODE" .config > artifacts/kernel_info.txt 2>&1 || true
        fi
        
        # List all artifacts
        echo "=== ARTIFACTS COLLECTED ==="
        find artifacts/ -type f 2>/dev/null | while read file; do
          SIZE=$(wc -c < "$file" 2>/dev/null || echo "0")
          echo "- $(basename "$file") (${SIZE} bytes)"
        done || echo "No artifacts found"
        
        # If no kernel images were found, show error
        if [ -z "$(find artifacts -name 'Image*' -o -name 'zImage' -o -name '*.img' 2>/dev/null)" ]; then
          echo "❌ No kernel images found in artifacts!"
          echo "Checking for any build output..."
          find . -name "*.ko" -type f 2>/dev/null | head -5
          find arch/arm64/boot -type f 2>/dev/null
        else
          echo "✅ Kernel build artifacts collected successfully"
        fi
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: kernel-build-${{ github.run_id }}
        path: artifacts/
        if-no-files-found: warn
        retention-days: 7
