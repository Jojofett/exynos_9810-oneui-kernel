name: Kernel Builder

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device: 1=starlte (S9)'
        default: '1'
        type: choice
        options: ['1', '2', '3', '4', '5', '6']

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: false
        ref: 4.9.337-oneui
    
    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y build-essential bc libssl-dev libncurses-dev libelf-dev flex bison git wget tar xz-utils python3 make gcc g++ cpio abootimg dos2unix
    
    - name: Fix KernelSU
      run: |
        mkdir -p drivers/kernelsu
        echo 'config KSU' > drivers/kernelsu/Kconfig
        echo '	bool "KernelSU"' >> drivers/kernelsu/Kconfig
        echo '	default n' >> drivers/kernelsu/Kconfig
    
    - name: Download Clang
      run: |
        mkdir -p compiler
        wget -q "https://storage.googleapis.com/android-llvm-toolchain/llvm-r522817/clang-r522817.tar.gz" -O clang.tar.gz
        if [ -f "clang.tar.gz" ]; then
          mkdir -p compiler/clang-18.0.1-r522817
          tar -xzf clang.tar.gz -C compiler/clang-18.0.1-r522817
          rm clang.tar.gz
        fi
    
    - name: Setup
      run: |
        chmod +x apollo.sh
        dos2unix apollo.sh 2>/dev/null || true
        mkdir -p Apollo/{A.I.K,Ramdisk,Out,Product,toolchain}
        echo "#!/bin/bash" > Apollo/A.I.K/repackimg.sh
        echo "touch image-new.img" >> Apollo/A.I.K/repackimg.sh
        chmod +x Apollo/A.I.K/repackimg.sh
    
    - name: Patch apollo.sh
      run: |
        sed -i 's|CR_TC=\.\./compiler|CR_TC=./compiler|g' apollo.sh
        sed -i 's/read -p "Download Toolchain ? (y\/n) > " TC_DL/TC_DL="n"/' apollo.sh
        sed -i 's/read -p "Enable KernelSU? (y\/n) > " CR_KSU/CR_KSU="n"/' apollo.sh
    
    - name: Build
      run: |
        echo -e "1\n3\n1\nn\ny" > input.txt
        timeout 2400 ./apollo.sh < input.txt 2>&1 | tee build.log || true
    
    - name: Collect
      run: |
        mkdir -p artifacts
        find arch/arm64/boot -name "Image*" -exec cp {} artifacts/ \; 2>/dev/null || true
        find arch/arm64/boot -name "zImage*" -exec cp {} artifacts/ \; 2>/dev/null || true
        cp build.log artifacts/ 2>/dev/null || true
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: artifacts/
        if-no-files-found: warn
