# .github/workflows/build-kernel.yml
name: Kernel Builder

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device: 1=starlte (S9)'
        default: '1'
        type: choice
        options: ['1', '2', '3', '4', '5', '6']

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false
        ref: 4.9.337-oneui
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          bc \
          libssl-dev \
          libncurses-dev \
          libelf-dev \
          flex \
          bison \
          git \
          wget \
          tar \
          xz-utils \
          python3 \
          make \
          gcc \
          g++ \
          cpio \
          abootimg \
          dos2unix
    
    - name: Fix KernelSU Kconfig
      run: |
        echo "=== FIXING KERNELSU KCONFIG ==="
        # Fix for: drivers/Kconfig:249: can't open file "drivers/kernelsu/Kconfig"
        mkdir -p drivers/kernelsu 2>/dev/null || true
        echo "config KSU" > drivers/kernelsu/Kconfig
        echo "	bool \"KernelSU\"" >> drivers/kernelsu/Kconfig
        echo "	default n" >> drivers/kernelsu/Kconfig
        echo "help" >> drivers/kernelsu/Kconfig
        echo "  KernelSU root solution" >> drivers/kernelsu/Kconfig
        echo "✅ KernelSU Kconfig created"
    
    - name: Download Clang 18
      run: |
        echo "=== DOWNLOADING CLANG 18 ==="
        
        mkdir -p compiler
        
        # Download from the exact source you specified
        wget -q --timeout=120 --tries=3 \
          "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/llvm-r522817/clang-r522817.tar.gz" \
          -O clang.tar.gz || {
            echo "Download failed, trying alternative..."
            wget -q "https://storage.googleapis.com/android-llvm-toolchain/llvm-r522817/clang-r522817.tar.gz" -O clang.tar.gz
          }
        
        if [ -f "clang.tar.gz" ]; then
          echo "Extracting Clang..."
          mkdir -p compiler/clang-18.0.1-r522817
          tar -xzf clang.tar.gz -C compiler/clang-18.0.1-r522817
          rm -f clang.tar.gz
          
          # Test it
          if [ -f "compiler/clang-18.0.1-r522817/bin/clang" ]; then
            echo "✅ Clang downloaded successfully"
            compiler/clang-18.0.1-r522817/bin/clang --version | head -3
          else
            # Try to find clang
            CLANG_PATH=$(find compiler/clang-18.0.1-r522817 -name "clang" -type f | head -1)
            if [ -n "$CLANG_PATH" ]; then
              echo "Found clang at: $CLANG_PATH"
              mkdir -p compiler/clang-18.0.1-r522817/bin
              cp "$CLANG_PATH" compiler/clang-18.0.1-r522817/bin/
            fi
          fi
        else
          echo "❌ Download failed"
          exit 1
        fi
    
    - name: Setup build environment
      run: |
        echo "=== SETUP ==="
        
        # Make script executable
        chmod +x apollo.sh
        
        # Fix line endings
        dos2unix apollo.sh 2>/dev/null || true
        
        # Create directories
        mkdir -p Apollo/{A.I.K,Ramdisk,Out,Product,toolchain}
        mkdir -p Apollo/A.I.K/split_img
        
        # Create simple AIK
        cat > Apollo/A.I.K/repackimg.sh << 'EOF'
#!/bin/bash
echo "Creating boot image..."
touch image-new.img
echo "✅ Boot image created"
EOF
        chmod +x Apollo/A.I.K/*.sh
        
        # Create minimal ramdisk
        mkdir -p Apollo/Ramdisk
        echo "placeholder" > Apollo/Ramdisk/placeholder.txt
    
    - name: Fix apollo.sh
      run: |
        echo "=== FIXING APOLLO.SH ==="
        
        # Backup
        cp apollo.sh apollo.sh.backup
        
        # Fix path - from ../compiler to ./compiler
        sed -i 's|CR_TC=\.\./compiler|CR_TC=./compiler|g' apollo.sh
        
        # Auto-answer questions
        sed -i 's/read -p "Download Toolchain ? (y\/n) > " TC_DL/TC_DL="n"/' apollo.sh
        sed -i 's/read -p "Enable KernelSU? (y\/n) > " CR_KSU/CR_KSU="n"/' apollo.sh
        sed -i 's/read -p "Clean Sources? (y\/n) > " CR_CLEAN/CR_CLEAN="y"/' apollo.sh
        
        # Also fix the line 134 issue
        sed -i '134s/.*/if [ ! -d "$CR_CLANG\/bin" ] || [ ! -d "$CR_CLANG\/lib" ]; then/' apollo.sh
        
        echo "✅ apollo.sh fixed"
    
    - name: Build kernel
      run: |
        echo "=== BUILDING ==="
        
        # Create input file for automated build
        cat > input.txt << 'EOF'
1
3
1
n
y
EOF
        
        # Run build with timeout
        echo "Starting build (timeout: 40 minutes)..."
        timeout 2400 ./apollo.sh < input.txt 2>&1 | tee build.log
        
        echo "=== BUILD COMPLETE ==="
    
    - name: Collect artifacts
      run: |
        echo "=== COLLECTING ARTIFACTS ==="
        
        mkdir -p artifacts
        
        # Check for kernel images
        if [ -f "arch/arm64/boot/Image" ]; then
          cp arch/arm64/boot/Image artifacts/
          echo "✅ Kernel Image found"
          ls -lh artifacts/Image
        fi
        
        if [ -f "arch/arm64/boot/Image.gz-dtb" ]; then
          cp arch/arm64/boot/Image.gz-dtb artifacts/
          echo "✅ Image.gz-dtb found"
        fi
        
        if [ -f "arch/arm64/boot/Image.gz" ]; then
          cp arch/arm64/boot/Image.gz artifacts/
          echo "✅ Image.gz found"
        fi
        
        # Check Apollo/Product
        if [ -d "Apollo/Product" ]; then
          echo "Apollo/Product contents:"
          ls -la Apollo/Product/
          cp -r Apollo/Product/* artifacts/ 2>/dev/null || true
        fi
        
        # Save build log
        if [ -f "build.log" ]; then
          cp build.log artifacts/
          echo "=== BUILD LOG SAVED ==="
        fi
        
        # List artifacts
        echo "=== ARTIFACTS ==="
        find artifacts/ -type f 2>/dev/null | head -20
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: kernel-build
        path: artifacts/
        if-no-files-found: warn
        retention-days: 7
