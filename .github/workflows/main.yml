# .github/workflows/build-kernel.yml
name: Kernel Builder

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device: 1=starlte (S9)'
        default: '1'
        type: choice
        options: ['1', '2', '3', '4', '5', '6']

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false
    
    - name: FIX apollo.sh COMPLETELY
      run: |
        # 1. Make executable
        chmod +x apollo.sh
        
        # 2. FIX LINE 134 - The "too many arguments" error
        # Find the exact line and fix it
        sed -i '134s/.*/if [ ! -d "$CR_CLANG/bin" ] || [ ! -d "$CR_CLANG/lib" ]; then/' apollo.sh
        
        # 3. FIX COMPILER PATH - It's looking in ../compiler which is wrong
        # Change from ../compiler to ./compiler (relative to workspace)
        sed -i 's|CR_TC=../compiler|CR_TC=./compiler|' apollo.sh
        
        # 4. AUTO-ANSWER ALL PROMPTS
        sed -i 's/read -p "Download Toolchain ? (y\/n) > " TC_DL/TC_DL="y"/' apollo.sh
        sed -i 's/read -p "Enable KernelSU? (y\/n) > " CR_KSU/CR_KSU="n"/' apollo.sh
        
        # 5. SET DEFAULTS
        sed -i 's/DEFAULT_TARGET=3/DEFAULT_TARGET=1/' apollo.sh  # Change default to starlte
        sed -i 's/DEFAULT_COMPILER=3/DEFAULT_COMPILER=3/' apollo.sh
        
        echo "Script fixed successfully"
    
    - name: Create compiler directory IN WORKSPACE
      run: |
        # Create compiler directory WHERE THE SCRIPT EXPECTS IT
        mkdir -p compiler/clang-18.0.1-r522817
        
        # Download Clang 18 DIRECTLY
        echo "Downloading Clang 18..."
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/llvm-r522817/clang-r522817.tar.gz -O clang.tar.gz
        
        # Extract to CORRECT location
        tar -xzf clang.tar.gz -C compiler/clang-18.0.1-r522817/
        rm -f clang.tar.gz
        
        # Verify
        if [ -f "compiler/clang-18.0.1-r522817/bin/clang" ]; then
          echo "✅ Compiler downloaded successfully"
          ./compiler/clang-18.0.1-r522817/bin/clang --version | head -2
        else
          echo "❌ Compiler download failed, trying alternative..."
          # Alternative: Download from LLVM releases
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-18.0.1/clang+llvm-18.0.1-x86_64-linux-gnu-ubuntu-20.04.tar.xz -O llvm.tar.xz
          tar -xf llvm.tar.xz -C compiler/clang-18.0.1-r522817/ --strip-components=1
          rm -f llvm.tar.xz
        fi
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          bc \
          libssl-dev \
          libncurses-dev \
          libelf-dev \
          flex \
          bison \
          git
    
    - name: Setup directories
      run: |
        mkdir -p Apollo/{A.I.K,Ramdisk,Out,Product,toolchain}
        
        # Create minimal AIK
        mkdir -p Apollo/A.I.K/split_img
        cat > Apollo/A.I.K/repackimg.sh << 'EOF'
        #!/bin/bash
        echo "Creating boot image..."
        touch image-new.img
        echo -n "SEANDROIDENFORCE" >> image-new.img
        EOF
        chmod +x Apollo/A.I.K/*.sh
    
    - name: Build kernel for starlte
      run: |
        echo "=== BUILDING STARLTE (S9) ==="
        
        # Use printf with NO COMMENTS - just the answers
        # Order: 1. Device, 2. Compiler, 3. SELinux, 4. KSU, 5. Clean
        printf '1\n3\n1\nn\ny\n' | timeout 2400 ./apollo.sh
        
        echo "Build process finished"
    
    - name: Check results
      run: |
        echo "=== BUILD RESULTS ==="
        
        # Check compiler
        echo "Compiler status:"
        ls -la compiler/clang-18.0.1-r522817/bin/clang 2>/dev/null || echo "Compiler not found"
        
        # Check kernel compilation
        if [ -f "arch/arm64/boot/Image" ]; then
          echo "✅ Kernel Image compiled!"
          ls -lh arch/arm64/boot/Image
          
          # Copy to Product
          mkdir -p Apollo/Product
          cp arch/arm64/boot/Image Apollo/Product/kernel-Image
        else
          echo "❌ No kernel Image found"
          echo "Looking for any build output..."
          find . -name "Image" -o -name "*.img" -o -name "*.ko" | head -10
        fi
        
        # Check for any errors
        echo "Last 20 lines of any build logs:"
        find . -name "*.log" -type f -exec tail -20 {} \; 2>/dev/null || echo "No log files found"
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-starlte
        path: |
          arch/arm64/boot/
          Apollo/Product/
          compiler/clang-18.0.1-r522817/bin/clang
        if-no-files-found: warn
        retention-days: 30
